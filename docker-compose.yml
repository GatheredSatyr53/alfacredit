# Единый запуск всех компонентов: docker compose up --build
# Переменные берутся из .env (см. .env.example); у всех есть значения по умолчанию.
name: alfacredit

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfacredit}
      POSTGRES_USER: ${POSTGRES_USER:-alfacredit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfacredit}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Только для локальной отладки через psql/IDE; снаружи порт не нужен.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfacredit} -d ${POSTGRES_DB:-alfacredit}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Сервис скоринга (Python) по docs/scoring-contract.md. Сейчас заглушка из ./scoring, заменяется сервисом ML-команды.
  scoring:
    # Сервис скоринга команды ML (правила rules-0.3, репозиторий uandrosova07-arch/scoring): публичный образ из GitHub Container
    # Registry, закреплён на коммите репозитория scoring. Те же правила встроены в API как резервная модель.
    # Сборка из локального checkout репозитория scoring: docker compose -f docker-compose.yml -f compose.scoring.yml up --build
    image: ${SCORING_IMAGE:-ghcr.io/uandrosova07-arch/scoring:4ce9e8444e24b856a404753b5218cd00fc7bea19}
    environment:
      SCORING_MODEL: ${SCORING_MODEL:-rules-0.3}
    ports:
      # Только для локальной отладки (curl localhost:8000/health); API ходит по внутреннему адресу http://scoring:8000
      - "127.0.0.1:${SCORING_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: alfacredit-api:local
    depends_on:
      db:
        condition: service_healthy
      # API стартует, даже если скоринг ещё поднимается или упал: заявки считает встроенная модель (RulesFallback)
      scoring:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-alfacredit};Username=${POSTGRES_USER:-alfacredit};Password=${POSTGRES_PASSWORD:-alfacredit}"
      Jwt__Key: ${JWT_KEY:-demo-only-insecure-jwt-signing-key-change-me-0123456789}
      Jwt__Issuer: AlfaCredit
      Jwt__Audience: AlfaCredit
      Jwt__LifetimeMinutes: "480"
      Database__MigrateOnStartup: "true"
      Seed__Enabled: "true"
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-Demo123!}
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      Swagger__Enabled: "true"
      Processing__StageDelaySeconds: ${PROCESSING_STAGE_DELAY_SECONDS:-2}
      Simulators__FailureRate: ${SIMULATORS_FAILURE_RATE:-0}
      Scoring__Mode: ${SCORING_MODE:-External}
      Scoring__ModelVersion: ${SCORING_MODEL:-rules-0.3}
      Scoring__BaseUrl: ${SCORING_BASE_URL:-http://scoring:8000}
      Scoring__TimeoutSeconds: ${SCORING_TIMEOUT_SECONDS:-5}
      Scoring__Retries: ${SCORING_RETRIES:-2}
      Contracts__RevealCodeInResponse: ${CONTRACTS_REVEAL_CODE:-true}
      DemoManager__Enabled: ${DEMO_MANAGER_ENABLED:-true}
      DemoManager__DelaySeconds: ${DEMO_MANAGER_DELAY_SECONDS:-8}
      DemoManager__ApprovalProbability: ${DEMO_MANAGER_APPROVAL_PROBABILITY:-0.5}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
