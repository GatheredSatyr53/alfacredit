# Единый запуск всех компонентов: docker compose up --build
# Переменные берутся из .env (см. .env.example); у всех есть значения по умолчанию.
name: alfacredit

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfacredit}
      POSTGRES_USER: ${POSTGRES_USER:-alfacredit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfacredit}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Только для локальной отладки через psql/IDE; снаружи порт не нужен.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfacredit} -d ${POSTGRES_DB:-alfacredit}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: alfacredit-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-alfacredit};Username=${POSTGRES_USER:-alfacredit};Password=${POSTGRES_PASSWORD:-alfacredit}"
      Jwt__Key: ${JWT_KEY:-demo-only-insecure-jwt-signing-key-change-me-0123456789}
      Jwt__Issuer: AlfaCredit
      Jwt__Audience: AlfaCredit
      Jwt__LifetimeMinutes: "480"
      Database__MigrateOnStartup: "true"
      Seed__Enabled: "true"
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-Demo123!}
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      Swagger__Enabled: "true"
      Processing__StageDelaySeconds: ${PROCESSING_STAGE_DELAY_SECONDS:-2}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
