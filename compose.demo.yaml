name: alfacredit-demo

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfacredit}
      POSTGRES_USER: ${POSTGRES_USER:-alfacredit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfacredit-demo-only}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-alfacredit} -d ${POSTGRES_DB:-alfacredit}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  scoring:
    build:
      context: ./.demo/scoring
    image: alfacredit-demo-scoring:edc7f01
    environment:
      SCORING_MODEL: logreg-synthetic-0.1
    ports:
      - "127.0.0.1:${DEMO_SCORING_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
    image: alfacredit-demo-api:local
    depends_on:
      db:
        condition: service_healthy
      scoring:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-alfacredit};Username=${POSTGRES_USER:-alfacredit};Password=${POSTGRES_PASSWORD:-alfacredit-demo-only}"
      Jwt__Key: ${JWT_KEY:-demo-only-insecure-jwt-signing-key-change-me-0123456789}
      Jwt__Issuer: AlfaCredit
      Jwt__Audience: AlfaCredit
      Jwt__LifetimeMinutes: "480"
      Database__MigrateOnStartup: "true"
      Seed__Enabled: "true"
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-Demo123!}
      Swagger__Enabled: "true"
      Cors__Origins: "http://localhost:${DEMO_FRONTEND_PORT:-3000},http://127.0.0.1:${DEMO_FRONTEND_PORT:-3000}"
      Scoring__Mode: External
      Scoring__ModelVersion: logreg-synthetic-0.1
      Scoring__BaseUrl: http://scoring:8000
      Simulators__FailureRate: "0"
      Contracts__RevealCodeInResponse: "true"
      DemoManager__Enabled: "true"
      DemoManager__DelaySeconds: "8"
      DemoManager__ApprovalProbability: "0.5"
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-18080}:8080"
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./.demo/frontend
      args:
        VITE_API_BASE_URL: http://localhost:${DEMO_API_PORT:-18080}
    image: alfacredit-demo-frontend:986fc3c
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
