name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore (locked mode, packages.lock.json must match)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker-image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: alfacredit-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Образ сервиса скоринга из compose отвечает по контракту: health с rules-0.3 и демо-запрос «Ромашки» из общего эталона
      - name: Check scoring image contract
        run: |
          IMAGE=$(grep -o 'ghcr.io/[^} ]*' docker-compose.yml | head -1)
          echo "scoring image: $IMAGE"
          docker run -d --name scoring -p 8000:8000 "$IMAGE"
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          python3 - <<'PY'
          import json, urllib.request
          health = json.load(urllib.request.urlopen("http://localhost:8000/health", timeout=5))
          assert health.get("model_version") == "rules-0.3", health
          cases = json.load(open("tests/AlfaCredit.UnitTests/Scoring/conformance-rules-0.3.json", encoding="utf-8"))["cases"]
          case = next(c for c in cases if c["id"] == "demo-good")
          req = urllib.request.Request("http://localhost:8000/api/v1/score", data=json.dumps(case["input"]).encode(), headers={"Content-Type": "application/json"})
          body = json.load(urllib.request.urlopen(req, timeout=10))
          expected = case["expected"]
          assert (body["score"], body["risk_grade"], body["model_version"]) == (expected["score"], expected["risk_grade"], expected["model_version"]), body
          assert body["factors"] == expected["factors"] and body["warnings"] == expected["warnings"] and body["missing_data"] == expected["missing_data"], body
          print("scoring image ok:", body["model_version"], body["score"], body["risk_grade"])
          PY
          docker rm -f scoring
